<main class="container-fluid" id="content">
  <div class="container" style="margin-top: 30px; margin-bottom: 30px;">
    <div class="row">
      <!-- Link to MSP as part of AHDC/JHA application -->
      <div class="col-sm-12 col-md-6">
        <br>
        <a class="btn btn-primary btn-lg btn-block" href="https://my.gov.bc.ca/ahdc">
          {{newEnrollApp}}
        </a>
      </div>
      <!-- Link to MSP DEAM application -->
      <div class="col-sm-12 col-md-6">
        <br>
        <button class="btn btn-primary btn-lg btn-block" (click)="clearSavedAccountApp()">
          {{newAccountApp}}
        </button>
      </div>
    </div>
    <div class="row">
      <!-- Link to SuppBen as part of AHDC/JHA application -->
      <div class="col-sm-12 col-md-6">
        <br>
        <a class="btn btn-primary btn-lg btn-block" href="https://my.gov.bc.ca/ahdc">
          {{newBenefitApp}}
        </a>
      </div>
      <!-- Link to MSP ACL application -->
      <div class="col-sm-12 col-md-6">
        <br>
        <button class="btn btn-primary btn-lg btn-block" (click)="clearSavedAclApplication()">
          {{newAccountLetter}}
        </button>
      </div>
    </div>
    <div class="row">
      <!-- Link to RetroPA (should be redirected to PageNotFound) -->
      <div class="col-sm-12 col-md-6">
        <br>
        <button class="btn btn-primary btn-lg btn-block" (click)="redirectToPageNotFound()">
          {{newPaApp}}
        </button>
      </div>
    </div>
  </div>
</main>
